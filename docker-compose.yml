services:
    infer:
        build:
            context: ./infer
            dockerfile: Dockerfile
        restart: always
        volumes:
            - ./infer/models:/root/.insightface
            - ./infer/app.py:/app/app.py
            - ./infer/config.py:/app/config.py
            - ./infer/detector.py:/app/detector.py
            - ./infer/pipeline.py:/app/pipeline.py
            - ./infer/notebook_compat.py:/app/notebook_compat.py
            - ./infer/liveness.py:/app/liveness.py
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        networks:
            - app

    api:
        build:
            context: .
            dockerfile: api/Dockerfile
        restart: always
        ports:
            - "8080:8080"
        environment:
            - PORT=8080
            - DB_PATH=/data/face_reg.db
            - INFER_URL=http://infer:8001
            - JWT_SECRET=${JWT_SECRET}
        volumes:
            - ./data:/data
            - ./web:/app/web
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        depends_on:
            - infer
        networks:
            - app

networks:
    app:
        driver: bridge
