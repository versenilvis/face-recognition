services:
    infer:
        build:
            context: ./infer
            dockerfile: Dockerfile
        restart: always
        volumes:
            - ./infer/models:/root/.insightface
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        networks:
            - app

    api:
        build:
            context: ./api
            dockerfile: Dockerfile
        restart: always
        ports:
            - "8080:8080"
        environment:
            - PORT=8080
            - DB_PATH=/data/face_reg.db
            - INFER_URL=http://infer:8001
            - JWT_SECRET=${JWT_SECRET}
        volumes:
            - ./data:/data
            - ./api/web:/app/web
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        depends_on:
            - infer
        networks:
            - app

networks:
    app:
        driver: bridge
