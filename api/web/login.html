<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Giảng viên - FaceAttendance</title>
    <meta name="description" content="Đăng nhập bảng điều khiển giảng viên điểm danh khuôn mặt">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @import "tailwindcss";
        :root {
            font-family: 'Poppins', sans-serif;
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
            pointer-events: none;
        }
        .toast {
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(16px);
            color: #fff;
            pointer-events: auto;
        }
        .toast.toast-success { background: rgba(6, 78, 59, 0.95); }
        .toast.toast-error { background: rgba(136, 19, 55, 0.95); }
        .toast.toast-info { background: rgba(15, 23, 42, 0.95); }
    </style>
</head>
<body class="bg-[#04060a] text-slate-100 flex items-center justify-center min-h-screen font-sans">
    <main class="w-full max-w-[420px] px-5">
        <div class="bg-[#080e1e]/90 backdrop-blur-2xl rounded-3xl p-8 shadow-2xl">
            <div class="text-center mb-6">
                <div class="w-12 h-12 mx-auto mb-3.5 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-600/30">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <h1 class="text-lg font-bold tracking-tight mb-1 text-white">Đăng nhập Giảng viên</h1>
                <p class="text-xs text-slate-400">Hệ thống Điểm danh Khuôn mặt</p>
            </div>

            <form id="login-form">
                <div class="flex flex-col gap-1.5 mb-4">
                    <label class="text-xs font-medium text-slate-300" for="login-code">Mã truy cập giảng viên</label>
                    <input 
                        type="password" 
                        id="login-code" 
                        class="w-full px-4 py-2.5 bg-[#0e172a] rounded-xl text-white text-sm outline-none transition focus:bg-[#152340] focus:ring-2 focus:ring-blue-500/40" 
                        placeholder="Nhập mã truy cập (VD: gv123)" 
                        required 
                        autofocus
                        autocomplete="current-password"
                    >
                </div>

                <div id="login-error" class="hidden text-rose-300 text-xs mb-4 p-2.5 bg-rose-500/15 rounded-xl">
                </div>

                <button type="submit" id="btn-submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs rounded-xl shadow-lg shadow-blue-600/30 transition transform active:scale-[0.99] cursor-pointer">
                    Đăng nhập hệ thống
                </button>
            </form>

            <div class="mt-5 text-center">
                <a href="/" class="text-xs text-slate-400 hover:text-slate-200 inline-flex items-center gap-1.5 transition">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Quay lại màn hình camera
                </a>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/api.js?v=4.0"></script>
    <script>
        const form = document.getElementById('login-form');
        const codeInput = document.getElementById('login-code');
        const errorEl = document.getElementById('login-error');
        const submitBtn = document.getElementById('btn-submit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Đang xác thực...';

            try {
                const res = await API.login(codeInput.value.trim());
                showToast(`Chào mừng ${res.ho_ten || 'Giảng viên'}!`, 'success');
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 400);
            } catch (err) {
                errorEl.textContent = 'Mã truy cập không hợp lệ. Vui lòng kiểm tra lại!';
                errorEl.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Đăng nhập hệ thống';
            }
        });
    </script>
</body>
</html>
