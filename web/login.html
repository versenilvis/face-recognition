<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực Giảng viên - FaceAttendance</title>
    <meta name="description" content="Đăng nhập hệ thống quản lý điểm danh khuôn mặt">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @import "tailwindcss";
        :root {
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --rh-canvas: #04060a;
            --rh-card: #080b13;
            --rh-accent: #2a4690;
            --rh-accent-light: #9dbcff;
        }

        /* hide scrollbars globally */
        * {
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
        }
        *::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        .font-mono {
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            z-index: 9999;
            pointer-events: none;
        }
        .toast {
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 0.8125rem;
            font-weight: 500;
            box-shadow: 0 16px 36px -4px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(16px);
            color: #fff;
            background: rgba(10, 13, 22, 0.95);
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast.toast-success { border-color: rgba(16, 185, 129, 0.3); color: #34d399; }
        .toast.toast-error { border-color: rgba(244, 63, 94, 0.3); color: #fb7185; }
        .toast.toast-info { border-color: rgba(157, 188, 255, 0.3); color: #9dbcff; }
    </style>
</head>
<body class="bg-[#04060a] text-zinc-100 min-h-screen antialiased flex flex-col justify-end items-center p-6 sm:p-8 relative selection:bg-[#2a4690]/40 selection:text-[#9dbcff] overflow-x-hidden">

    <!-- WebGL2 Gradient ASCII Background -->
    <div id="ascii-background" class="fixed inset-0 z-0 overflow-hidden pointer-events-none"></div>

    <!-- Back button moved to bottom-left in dark area -->
    <a href="/" class="fixed bottom-6 left-6 sm:bottom-8 sm:left-8 z-20 inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/[0.06] hover:bg-white/[0.12] border border-white/10 hover:border-white/20 text-xs font-medium text-zinc-300 hover:text-white transition duration-150 backdrop-blur-md shadow-lg">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
        </svg>
        <span>Quay lại trang điểm danh</span>
    </a>

    <!-- Clean Frameless Login Form resting in bottom dark region -->
    <main class="w-full max-w-[420px] relative z-10 mb-4 sm:mb-8">
        
        <!-- Title -->
        <div class="mb-6">
            <h1 class="text-2xl sm:text-[1.7rem] font-bold tracking-tight text-white leading-tight">
                Xác thực Giảng viên
            </h1>
            <p class="text-xs sm:text-sm text-zinc-400 mt-1.5 font-normal leading-relaxed">
                Nhập mã truy cập để đăng nhập hệ thống quản lý
            </p>
        </div>

        <!-- Form -->
        <form id="login-form">
            <div class="mb-4">
                <label for="login-code" class="block text-xs font-medium text-zinc-300 mb-2">
                    Mã truy cập
                </label>
                <div class="relative">
                    <input 
                        type="password" 
                        id="login-code" 
                        class="w-full pl-4 pr-11 py-3 bg-white/[0.05] hover:bg-white/[0.08] focus:bg-[#060a14] border border-white/[0.14] focus:border-[#4b72db] focus:ring-1 focus:ring-[#4b72db] rounded-xl text-white text-base placeholder:text-zinc-500 outline-none transition duration-150 font-sans" 
                        placeholder="Nhập mã (mặc định: gv123)" 
                        required 
                        autofocus
                        autocomplete="current-password"
                    >
                    <button 
                        type="button" 
                        id="btn-toggle-code" 
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white transition-colors duration-150 cursor-pointer p-1"
                        title="Hiện hoặc ẩn mã"
                        tabindex="-1"
                    >
                        <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Error text -->
            <div id="login-error" class="hidden mb-3.5 flex items-center gap-1.5 text-rose-300 text-xs font-medium">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 text-rose-400">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <span id="login-error-text">Mã truy cập không hợp lệ. Vui lòng kiểm tra lại</span>
            </div>

            <button 
                type="submit" 
                id="btn-submit" 
                class="w-full py-3 px-5 bg-gradient-to-r from-[#244dc6] to-[#1c3da8] hover:from-[#2d5ce8] hover:to-[#2247bf] active:scale-[0.99] border border-[#5885f8]/40 rounded-xl text-sm font-semibold text-white shadow-[0_4px_16px_rgba(36,77,198,0.4),inset_0_1px_0_rgba(255,255,255,0.2)] flex items-center justify-center gap-2 transition duration-150 cursor-pointer"
            >
                <span>Đăng nhập</span>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14"/>
                    <path d="m12 5 7 7-7 7"/>
                </svg>
            </button>
        </form>

        <!-- Bottom hint and quick fill -->
        <div class="mt-4 pt-3 flex items-center justify-between text-xs text-zinc-400 border-t border-white/[0.08]">
            <span>Mã mặc định: <span class="font-mono text-zinc-200 font-medium">gv123</span></span>
            <button 
                type="button" 
                id="btn-quick-fill" 
                class="text-xs text-zinc-400 hover:text-white underline underline-offset-4 transition cursor-pointer"
            >
                Điền nhanh
            </button>
        </div>

    </main>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/api.js?v=4.0"></script>
    <script src="/js/gradient-ascii.js?v=1.0"></script>
    <script>
        // initialize webgl ascii background
        const bgContainer = document.getElementById('ascii-background');
        if (bgContainer && window.initGradientASCII) {
            initGradientASCII(bgContainer, {
                colors: ['#1e3fd8', '#f6f8ff', '#a5d8ff', '#38bdf8'],
                shape: 'horizon',
                characters: ' =+xX0S8#@',
                cellSize: 18,
                density: 0.8,
                glyphOpacity: 0.85,
                glow: 0.25,
                softness: 0.5,
                scale: 1,
                flow: 0.5,
                speed: 1,
                gradientOpacity: 0.9,
                grain: 0.08,
                clickEffect: 'wave',
                fontFamily: '"Geist Mono", monospace'
            });
        }

        const form = document.getElementById('login-form');
        const codeInput = document.getElementById('login-code');
        const errorEl = document.getElementById('login-error');
        const errorText = document.getElementById('login-error-text');
        const submitBtn = document.getElementById('btn-submit');
        const toggleBtn = document.getElementById('btn-toggle-code');
        const eyeIcon = document.getElementById('eye-icon');

        const quickFillBtn = document.getElementById('btn-quick-fill');

        // quick fill demo code
        if (quickFillBtn) {
            quickFillBtn.addEventListener('click', () => {
                codeInput.value = 'gv123';
                codeInput.focus();
            });
        }

        // toggle password visibility
        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                const isPassword = codeInput.type === 'password';
                codeInput.type = isPassword ? 'text' : 'password';
                if (isPassword) {
                    eyeIcon.innerHTML = '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/>';
                } else {
                    eyeIcon.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
                }
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Đang xác thực...</span>';

            try {
                const res = await API.login(codeInput.value.trim());
                showToast(`Chào mừng ${res.ho_ten || 'Giảng viên'}!`, 'success');
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 350);
            } catch (err) {
                if (errorText) {
                    errorText.textContent = err.message || 'Mã truy cập không hợp lệ. Vui lòng kiểm tra lại';
                }
                errorEl.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Đăng nhập</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>';
            }
        });
    </script>
</body>
</html>
