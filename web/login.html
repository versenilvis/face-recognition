<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực Giảng viên - FaceAttendance</title>
    <meta name="description" content="Đăng nhập hệ thống quản lý điểm danh khuôn mặt">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @import "tailwindcss";
        :root {
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --rh-canvas: #04060a;
            --rh-card: #080b13;
            --rh-accent: #2a4690;
            --rh-accent-light: #9dbcff;
        }

        /* hide scrollbars globally */
        * {
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
        }
        *::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        .font-mono {
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            z-index: 9999;
            pointer-events: none;
        }
        .toast {
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 0.8125rem;
            font-weight: 500;
            box-shadow: 0 16px 36px -4px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(16px);
            color: #fff;
            background: rgba(10, 13, 22, 0.95);
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast.toast-success { border-color: rgba(16, 185, 129, 0.3); color: #34d399; }
        .toast.toast-error { border-color: rgba(244, 63, 94, 0.3); color: #fb7185; }
        .toast.toast-info { border-color: rgba(157, 188, 255, 0.3); color: #9dbcff; }
    </style>
</head>
<body class="bg-[#04060a] text-zinc-100 min-h-screen antialiased flex flex-col justify-between items-center p-6 relative selection:bg-[#2a4690]/40 selection:text-[#9dbcff]">

    <!-- Subtle ambient glow -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden">
        <div class="absolute top-[20%] left-1/2 -translate-x-1/2 w-[600px] h-[350px] bg-[radial-gradient(ellipse_at_center,rgba(42,70,144,0.12)_0%,transparent_70%)]"></div>
    </div>

    <!-- Top spacer for centering balance -->
    <div class="w-full max-w-sm flex items-center justify-between text-xs text-zinc-400 relative z-10 pt-2">
        <a href="/" class="inline-flex items-center gap-2 hover:text-white transition-colors duration-150">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 18-6-6 6-6"/>
            </svg>
            <span>Quay lại camera</span>
        </a>
        <div class="flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
            <span>Hệ thống sẵn sàng</span>
        </div>
    </div>

    <!-- Minimalist Auth Card -->
    <main class="w-full max-w-sm my-auto relative z-10">
        <div class="bg-[#080b13] border border-white/[0.08] rounded-2xl p-7 sm:p-8 shadow-[inset_0_1px_0_rgba(255,255,255,0.06),0_20px_50px_rgba(0,0,0,0.6)]">
            
            <!-- Brand icon and title -->
            <div class="mb-6">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9dbcff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="mb-3">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                <h1 class="text-xl font-bold tracking-tight text-white">
                    Xác thực Giảng viên
                </h1>
                <p class="text-xs text-zinc-400 mt-1 font-normal leading-relaxed">
                    Nhập mã truy cập để đăng nhập hệ thống quản lý
                </p>
            </div>

            <!-- Form -->
            <form id="login-form">
                <div class="mb-4">
                    <label for="login-code" class="block text-xs font-medium text-zinc-300 mb-1.5">
                        Mã truy cập
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="login-code" 
                            class="w-full pl-3.5 pr-10 py-2.5 bg-white/[0.03] hover:bg-white/[0.05] focus:bg-[#0b0f1a] border border-white/[0.1] focus:border-[#4b72db] focus:ring-1 focus:ring-[#4b72db] rounded-xl text-white text-sm placeholder:text-zinc-600 outline-none transition duration-150 font-sans" 
                            placeholder="Nhập mã (mặc định: gv123)" 
                            required 
                            autofocus
                            autocomplete="current-password"
                        >
                        <button 
                            type="button" 
                            id="btn-toggle-code" 
                            class="absolute right-2.5 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white transition-colors duration-150 cursor-pointer p-1"
                            title="Hiện hoặc ẩn mã"
                            tabindex="-1"
                        >
                            <svg id="eye-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Clean error text without box container -->
                <div id="login-error" class="hidden mb-3.5 flex items-center gap-1.5 text-rose-300 text-xs font-medium">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 text-rose-400">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <span id="login-error-text">Mã truy cập không hợp lệ. Vui lòng kiểm tra lại</span>
                </div>

                <button 
                    type="submit" 
                    id="btn-submit" 
                    class="w-full py-2.5 px-4 bg-gradient-to-b from-[#284894] to-[#1c336b] hover:from-[#3055ae] hover:to-[#223e80] active:scale-[0.98] border border-[#4b72db]/40 rounded-xl text-xs sm:text-sm font-semibold text-white shadow-[0_2px_8px_rgba(0,0,0,0.35),inset_0_1px_0_rgba(255,255,255,0.18)] flex items-center justify-center gap-2 transition duration-150 cursor-pointer"
                >
                    <span>Đăng nhập</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"/>
                        <path d="m12 5 7 7-7 7"/>
                    </svg>
                </button>
            </form>

            <div class="mt-4 pt-4 border-t border-white/[0.05] text-center">
                <span class="text-xs text-zinc-400">Mã mặc định: <span class="font-mono text-zinc-300">gv123</span></span>
            </div>

        </div>
    </main>

    <!-- Bottom copyright -->
    <footer class="w-full max-w-sm text-center text-xs text-zinc-400 relative z-10 pb-2">
        Face Attendance Management
    </footer>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/api.js?v=4.0"></script>
    <script>
        const form = document.getElementById('login-form');
        const codeInput = document.getElementById('login-code');
        const errorEl = document.getElementById('login-error');
        const errorText = document.getElementById('login-error-text');
        const submitBtn = document.getElementById('btn-submit');
        const toggleBtn = document.getElementById('btn-toggle-code');
        const eyeIcon = document.getElementById('eye-icon');

        // toggle password visibility
        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                const isPassword = codeInput.type === 'password';
                codeInput.type = isPassword ? 'text' : 'password';
                if (isPassword) {
                    eyeIcon.innerHTML = '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/>';
                } else {
                    eyeIcon.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
                }
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Đang xác thực...</span>';

            try {
                const res = await API.login(codeInput.value.trim());
                showToast(`Chào mừng ${res.ho_ten || 'Giảng viên'}!`, 'success');
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 350);
            } catch (err) {
                if (errorText) {
                    errorText.textContent = err.message || 'Mã truy cập không hợp lệ. Vui lòng kiểm tra lại';
                }
                errorEl.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Đăng nhập</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>';
            }
        });
    </script>
</body>
</html>
